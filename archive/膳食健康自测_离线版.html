eyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-14px)}}\n\n  .verdict-eye{font-size:11px;letter-spacing:.22em;text-transform:uppercase;opacity:.85;font-weight:500;display:inline-flex;align-items:center;gap:8px;position:relative;z-index:1}\n  .verdict-eye::before{content:\"\";width:18px;height:1px;background:#fff;opacity:.6}\n\n  .verdict{font-size:38px;line-height:1.1;font-weight:700;margin:14px 0 6px;letter-spacing:-.01em;position:relative;z-index:1}\n  .verdict-sub{font-size:14.5px;opacity:.92;margin:0;position:relative;z-index:1}\n\n  .light-icon{\n    position:absolute;right:22px;top:30px;width:64px;height:88px;\n    z-index:1;\n  }\n\n  /* Score chips */\n  .score-row{\n    display:grid;grid-template-columns:repeat(3,1fr);gap:10px;\n    margin:-58px 18px 0;position:relative;z-index:2;\n  }\n  .chip{\n    background:var(--card);border-radius:16px;padding:14px 10px;text-align:center;\n    box-shadow:var(--shadow-md);border:1px solid var(--line);\n  }\n  .chip .num{font-size:28px;font-weight:700;font-family:\"Inter\",\"SF Pro Display\",-apple-system,sans-serif;letter-spacing:-.02em;line-height:1}\n  .chip .lbl{font-size:11.5px;color:var(--muted);margin-top:6px;letter-spacing:.05em}\n  .chip.r .num{color:var(--red)}\n  .chip.y .num{color:#b97a14}\n  .chip.g .num{color:var(--green)}\n\n  /* Description card */\n  .panel{margin:18px;padding:20px;background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-sm)}\n  .panel h3{margin:0 0 10px;font-size:16px;font-weight:600;letter-spacing:-.005em;display:flex;align-items:center;gap:8px}\n  .panel h3 .pip{width:8px;height:8px;border-radius:50%}\n  .panel h3.r .pip{background:var(--red)}\n  .panel h3.y .pip{background:var(--amber)}\n  .panel h3.g .pip{background:var(--green)}\n  .panel p{margin:0;color:var(--ink-2);font-size:14.5px;line-height:1.7}\n\n  /* Breakdown */\n  .breakdown{margin:18px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}\n  .br-title{padding:16px 18px 8px;font-size:13px;color:var(--muted);letter-spacing:.06em;font-weight:500;text-transform:uppercase}\n  .br-row{padding:12px 18px;border-top:1px solid var(--line);display:flex;align-items:center;gap:12px}\n  .br-row:first-of-type{border-top:none}\n  .br-label{flex:1;font-size:14px;color:var(--ink-2)}\n  .br-bar{flex:0 0 96px;height:6px;border-radius:3px;background:rgba(20,24,28,.06);overflow:hidden;position:relative}\n  .br-bar .f{position:absolute;inset:0;width:0;border-radius:3px;transition:width 1s cubic-bezier(.2,.7,.2,1) .25s}\n  .br-bar.r .f{background:var(--red)}\n  .br-bar.y .f{background:var(--amber)}\n  .br-bar.g .f{background:var(--green)}\n  .br-val{flex:0 0 auto;font-family:\"SF Mono\",ui-monospace,Menlo,monospace;font-size:13px;font-weight:600;color:var(--ink);width:36px;text-align:right}\n\n  /* CTA */\n  .cta-wrap{margin:24px 18px 8px}\n  .cta{\n    width:100%;padding:18px;border-radius:16px;border:none;\n    background:var(--ink);color:#fff;font-size:15.5px;font-weight:600;\n    cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;gap:10px;\n    box-shadow:var(--shadow-md);transition:all .25s;\n  }\n  .cta:active{transform:scale(.985)}\n  .cta svg{transition:transform .25s}\n  .cta:hover svg{transform:translate(2px,-2px)}\n\n  .restart{display:block;text-align:center;width:100%;margin-top:14px;background:none;border:none;color:var(--muted);font-size:13.5px;cursor:pointer;font-family:inherit;padding:8px;letter-spacing:.04em}\n  .restart:hover{color:var(--ink)}\n\n  /* ============ Meal list modal ============ */\n  .modal{position:fixed;inset:0;z-index:50;display:none;align-items:flex-end;justify-content:center}\n  .modal.open{display:flex;animation:fade .25s ease both}\n  .modal-bg{position:absolute;inset:0;background:rgba(20,24,28,.45);backdrop-filter:blur(4px)}\n  .modal-sheet{\n    position:relative;width:100%;max-width:520px;max-height:92dvh;background:var(--bg);\n    border-radius:24px 24px 0 0;overflow:hidden;display:flex;flex-direction:column;\n    animation:slide-up .35s cubic-bezier(.2,.7,.2,1) both;\n  }\n  @keyframes slide-up{from{transform:translateY(100%)}to{transform:none}}\n\n  .sheet-handle{width:44px;height:5px;border-radius:3px;background:rgba(20,24,28,.18);margin:10px auto 0;flex:0 0 auto}\n  .sheet-head{padding:14px 22px 16px;border-bottom:1px solid var(--line);background:var(--bg);display:flex;justify-content:space-between;align-items:center;gap:14px;flex:0 0 auto}\n  .sheet-head h2{margin:0;font-size:18px;font-weight:700;letter-spacing:-.005em}\n  .sheet-head .x{background:rgba(20,24,28,.06);border:none;width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink-2)}\n  .sheet-head p{margin:4px 0 0;font-size:12.5px;color:var(--muted);width:100%}\n  .sheet-body{overflow-y:auto;padding:8px 0 32px;-webkit-overflow-scrolling:touch}\n\n  /* Meal list */\n  .meal-hero{padding:18px 22px 8px}\n  .meal-hero .pillrow{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}\n  .meal-hero .pill{font-size:11.5px;padding:4px 10px;border-radius:999px;background:#fff;border:1px solid var(--line);color:var(--ink-2)}\n\n  .meal-section{margin:14px 18px;background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}\n  .ms-head{display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:1px solid var(--line);background:var(--card)}\n  .ms-emoji{\n    width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;\n    font-weight:700;font-size:16px;letter-spacing:-.02em;flex:0 0 auto;\n  }\n  .ms-emoji.zg{background:#FFE9D9;color:#C25C12}\n  .ms-emoji.sg{background:#E0F2E8;color:#1c7a52}\n  .ms-emoji.sc{background:#FCEFD7;color:#9c6a16}\n  .ms-emoji.dz{background:#E6E9FF;color:#3641A8}\n  .ms-emoji.nz{background:#F0E1FF;color:#7330B0}\n  .ms-emoji.yh{background:#FFE4E4;color:#B23535}\n  .ms-emoji.dr{background:#DEF1FF;color:#2360AB}\n  .ms-head .titles h4{margin:0;font-size:14.5px;font-weight:600}\n  .ms-head .titles span{font-size:12px;color:var(--muted);font-family:\"SF Mono\",ui-monospace,Menlo,monospace}\n\n  .ms-body{padding:6px 18px 14px}\n  .ms-row{display:flex;justify-content:space-between;align-items:baseline;padding:8px 0;border-top:1px dashed var(--line);font-size:14px}\n  .ms-row:first-child{border-top:none}\n  .ms-row .item{color:var(--ink-2);flex:1}\n  .ms-row .qty{color:var(--ink);font-weight:600;font-family:\"SF Mono\",ui-monospace,Menlo,monospace;font-size:12.5px}\n\n  .meal-tip{margin:14px 18px 0;padding:14px 16px;background:#FFFCF3;border:1px solid #F0E5C2;border-radius:14px;color:#5b4a14;font-size:13px;line-height:1.65;display:flex;gap:10px;align-items:flex-start}\n  .meal-tip strong{color:#3a2e08}\n\n  /* tiny check icons in answers - reused */\n  .ic{width:16px;height:16px;display:inline-block;vertical-align:middle}\n\n  /* selection highlight per-tag color when answered */\n  .qcard[data-tag=\"r\"].matched{box-shadow:inset 0 0 0 1.5px var(--red), var(--shadow-sm);border-color:var(--red)}\n  .qcard[data-tag=\"y\"].matched{box-shadow:inset 0 0 0 1.5px var(--amber), var(--shadow-sm);border-color:var(--amber)}\n  .qcard[data-tag=\"g\"].matched{box-shadow:inset 0 0 0 1.5px var(--green), var(--shadow-sm);border-color:var(--green)}\n\n  /* result hero animated meter */\n  .meter{position:absolute;left:22px;bottom:18px;display:flex;gap:6px;z-index:1}\n  .meter span{width:6px;height:18px;border-radius:2px;background:rgba(255,255,255,.32)}\n  .meter span.on{background:#fff}\n\n  @media (min-width:520px){\n    .app{box-shadow:0 0 0 1px var(--line);background:var(--bg)}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n  <div class=\"app\">\n\n    <!-- ====================== QUESTIONNAIRE ====================== -->\n    <section id=\"view-quiz\" class=\"view active\">\n      <header class=\"hero\">\n        <span class=\"eyebrow\">互动 ② · 约 1 分钟<\u002Fspan>\n        <h1>身心营养<br><span class=\"accent\">红<\u002Fspan><span class=\"accent-2\">绿<\u002Fspan><span class=\"accent-3\">灯<\u002Fspan> · 15题自测<\u002Fh1>\n        <p class=\"sub\">提交后立即获得你的红 / 黄 / 绿结果。<\u002Fp>\n        <div class=\"lights\">\n          <span class=\"dot r\"><i><\u002Fi>警惕<\u002Fspan>\n          <span class=\"dot y\"><i><\u002Fi>观察<\u002Fspan>\n          <span class=\"dot g\"><i><\u002Fi>保持<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fheader>\n\n      <div class=\"notice\">\n        <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#9c6a16\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" y1=\"8\" x2=\"12\" y2=\"12\"><\u002Fline><line x1=\"12\" y1=\"16\" x2=\"12.01\" y2=\"16\"><\u002Fline><\u002Fsvg>\n        <span>请根据<strong>最近 2 周<\u002Fstrong>的真实情况填写。家长，请以孩子最近 2 周的饮食和作息情况为准。<\u002Fspan>\n      <\u002Fdiv>\n\n      <div class=\"progress-wrap\">\n        <div class=\"progress-row\">\n          <span class=\"label\">已完成<\u002Fspan>\n          <span class=\"count\"><b id=\"done-n\">0<\u002Fb> / 15<\u002Fspan>\n        <\u002Fdiv>\n        <div class=\"bar\"><div class=\"fill\" id=\"bar\"><\u002Fdiv><\u002Fdiv>\n      <\u002Fdiv>\n\n      <div class=\"qlist\" id=\"qlist\"><\u002Fdiv>\n\n      <div class=\"submit-wrap\">\n        <button class=\"submit\" id=\"submit\" disabled=\"\">\n          请先完成全部 15 题 <span class=\"arrow\">→<\u002Fspan>\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fsection>\n\n    <!-- ====================== RESULT ====================== -->\n    <section id=\"view-result\" class=\"view result\"><\u002Fsection>\n\n  <\u002Fdiv>\n\n  <!-- ====================== MEAL LIST MODAL ====================== -->\n  <div class=\"modal\" id=\"meal-modal\" aria-hidden=\"true\">\n    <div class=\"modal-bg\" data-close=\"\"><\u002Fdiv>\n    <div class=\"modal-sheet\" role=\"dialog\" aria-modal=\"true\">\n      <div class=\"sheet-handle\"><\u002Fdiv>\n      <div class=\"sheet-head\">\n        <div>\n          <h2>每日标准膳食清单<\u002Fh2>\n          <p>参考《中国居民膳食指南》· 学龄儿童版<\u002Fp>\n        <\u002Fdiv>\n        <button class=\"x\" data-close=\"\" aria-label=\"关闭\">\n          <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.5\" stroke-linecap=\"round\"><path d=\"M18 6L6 18M6 6l12 12\"><\u002Fpath><\u002Fsvg>\n        <\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"sheet-body\" id=\"meal-body\"><\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<script>\n/* ============================================================\n   Data\n============================================================ */\nconst QUESTIONS = [\n  // Red — 警惕\n  {tag:\"r\", text:\"经常不吃早餐，空腹到中午\"},\n  {tag:\"r\", text:\"三餐总有一顿\\u201C随便凑合\\u201D\"},\n  {tag:\"r\", text:\"每天喝含糖饮料或吃甜食 ≥ 1 次\"},\n  {tag:\"r\", text:\"每日蔬菜摄入量不足一拳头\"},\n  {tag:\"r\", text:\"很少吃鱼或海鲜类食物\"},\n  // Yellow — 观察\n  {tag:\"y\", text:\"偶尔熬夜，导致第二天食欲差\"},\n  {tag:\"y\", text:\"经常点重盐、重辣的外卖\"},\n  {tag:\"y\", text:\"吃饭速度快，10 分钟内解决\"},\n  {tag:\"y\", text:\"每天喝水量不足 1500ml\"},\n  {tag:\"y\", text:\"加餐零食常选薯片、饼干类\"},\n  // Green — 保持\n  {tag:\"g\", text:\"每天吃早餐，且搭配营养均衡\"},\n  {tag:\"g\", text:\"三餐定时定量，规律进食\"},\n  {tag:\"g\", text:\"每天摄入足量的新鲜蔬菜和水果\"},\n  {tag:\"g\", text:\"每周吃鱼或海鲜类食物 2–3 次\"},\n  {tag:\"g\", text:\"主动少喝含糖饮料，多喝白水\"},\n];\n\nconst TAG_LABEL = {r:\"红灯 · 警惕\", y:\"黄灯 · 观察\", g:\"绿灯 · 保持\"};\n\nconst RESULT_COPY = {\n  g:{\n    title:\"绿灯 · 保持区\",\n    sub:\"你的身心营养习惯总体比较稳定\",\n    body:\"请继续保持规律早餐、三餐定时、足量蔬果、每周鱼类摄入和少喝含糖饮料的习惯。今天的讲座可以帮助你把这些好习惯坚持得更稳。\",\n  },\n  y:{\n    title:\"黄灯 · 观察区\",\n    sub:\"你目前有一些可调整的习惯\",\n    body:\"它们暂时不一定严重，但如果长期存在，可能会影响身高、眼睛、大脑状态、情绪稳定和免疫力。建议你从最容易做到的一项开始改变 —— 比如每天多加一拳蔬菜、把含糖饮料换成白水、或把晚睡提前 15 分钟。\",\n  },\n  r:{\n    title:\"红灯 · 警惕区\",\n    sub:\"你目前存在多个需要关注的信号\",\n    body:\"这不代表已经生病，而是提醒：身体和情绪可能正在承受额外负担。建议从一个最关键的习惯开始调整 —— 例如规律早餐、减少含糖饮料、增加蔬菜和优质蛋白。如果孩子同时伴随明显睡眠、情绪、体重、发育或注意力问题，建议咨询医生或营养专业人员。\",\n  },\n};\n\n/* Standard meal list — based on Chinese Dietary Guidelines for school-age children */\nconst MEAL_DATA = {\n  intro:\"以下为学龄儿童（6–17岁）每日推荐摄入量参考。家长可按孩子年龄段酌情调整。\",\n  pills:[\"早餐 7:00–8:00\",\"午餐 12:00\",\"加餐 15:30\",\"晚餐 18:00–19:00\"],\n  groups:[\n    {key:\"zg\", title:\"主食 · 谷薯杂豆\", sub:\"GRAINS\", items:[\n      {item:\"米饭 / 面条 / 馒头\",qty:\"200–300 g\"},\n      {item:\"全谷物（燕麦、糙米等）\",qty:\"50–100 g\"},\n      {item:\"薯类（红薯、土豆）\",qty:\"50–100 g\"},\n    ]},\n    {key:\"sg\", title:\"蔬菜\", sub:\"VEGETABLES\", items:[\n      {item:\"深色蔬菜（菠菜、西兰花等）\",qty:\"≥ 150 g\"},\n      {item:\"浅色蔬菜（白菜、黄瓜等)\",qty:\"≥ 150 g\"},\n    ]},\n    {key:\"sc\", title:\"水果\", sub:\"FRUITS\", items:[\n      {item:\"新鲜应季水果\",qty:\"200–350 g\"},\n      {item:\"建议直接食用，不用果汁替代\",qty:\"\"},\n    ]},\n    {key:\"dz\", title:\"优质蛋白\", sub:\"PROTEIN\", items:[\n      {item:\"鱼或海鲜\",qty:\"40–75 g\"},\n      {item:\"禽畜瘦肉\",qty:\"40–75 g\"},\n      {item:\"鸡蛋\",qty:\"1 个 (50 g)\"},\n    ]},\n    {key:\"nz\", title:\"奶 · 豆制品\", sub:\"DAIRY & SOY\", items:[\n      {item:\"牛奶 / 酸奶\",qty:\"300–500 ml\"},\n      {item:\"豆腐 / 豆浆 / 豆干\",qty:\"25 g 大豆等量\"},\n    ]},\n    {key:\"yh\", title:\"坚果与油盐\", sub:\"NUTS · OIL · SALT\", items:[\n      {item:\"原味坚果\",qty:\"10 g (一小把)\"},\n      {item:\"烹调用油\",qty:\"≤ 25–30 g\"},\n      {item:\"食盐\",qty:\"< 5 g\"},\n      {item:\"添加糖\",qty:\"< 25 g\"},\n    ]},\n    {key:\"dr\", title:\"饮水\", sub:\"WATER\", items:[\n      {item:\"白水（首选）\",qty:\"1200–1500 ml\"},\n      {item:\"含糖饮料\",qty:\"尽量不喝\"},\n    ]},\n  ],\n  tip:\"小习惯，更重要：① 早餐里至少有「一杯奶 + 一个蛋 + 一份主食」；② 蔬菜先于主食上桌；③ 每周至少吃 2 次鱼；④ 把饮料默认换成白水。\"\n};\n\n/* ============================================================\n   Render questionnaire\n============================================================ */\nconst answers = new Array(QUESTIONS.length).fill(null); // 'yes' or 'no'\nconst qlist = document.getElementById(\"qlist\");\n\nQUESTIONS.forEach((q, i) => {\n  const card = document.createElement(\"div\");\n  card.className = \"qcard\";\n  card.dataset.tag = q.tag;\n  card.dataset.idx = i;\n  card.innerHTML = `\n    <div class=\"qhead\">\n      <span class=\"qnum\">Q${String(i+1).padStart(2,\"0\")}<\u002Fspan>\n      <span class=\"qtag ${q.tag}\"><i><\u002Fi>${TAG_LABEL[q.tag]}<\u002Fspan>\n    <\u002Fdiv>\n    <p class=\"qtext\">${q.text}<\u002Fp>\n    <div class=\"choices\">\n      <button class=\"choice yes\" data-v=\"yes\" type=\"button\"><span class=\"dot\"><\u002Fspan>符合<\u002Fbutton>\n      <button class=\"choice no\" data-v=\"no\" type=\"button\"><span class=\"dot\"><\u002Fspan>不符合<\u002Fbutton>\n    <\u002Fdiv>\n  `;\n  qlist.appendChild(card);\n});\n\nqlist.addEventListener(\"click\", e => {\n  const btn = e.target.closest(\".choice\");\n  if (!btn) return;\n  const card = btn.closest(\".qcard\");\n  const idx = +card.dataset.idx;\n  const v = btn.dataset.v;\n  answers[idx] = v;\n  card.querySelectorAll(\".choice\").forEach(b => b.classList.toggle(\"selected\", b === btn));\n  card.classList.add(\"answered\");\n  if (v === \"yes\") card.classList.add(\"matched\"); else card.classList.remove(\"matched\");\n  updateProgress();\n});\n\nconst bar = document.getElementById(\"bar\");\nconst doneN = document.getElementById(\"done-n\");\nconst submitBtn = document.getElementById(\"submit\");\n\nfunction updateProgress(){\n  const done = answers.filter(a=>a!==null).length;\n  doneN.textContent = done;\n  bar.style.width = (done/QUESTIONS.length*100)+\"%\";\n  if (done === QUESTIONS.length){\n    submitBtn.disabled = false;\n    submitBtn.innerHTML = `查看我的结果 <span class=\"arrow\">→<\u002Fspan>`;\n  } else {\n    submitBtn.disabled = true;\n    submitBtn.innerHTML = `还剩 ${QUESTIONS.length - done} 题 <span class=\"arrow\">→<\u002Fspan>`;\n  }\n}\n\nsubmitBtn.addEventListener(\"click\", () => {\n  if (submitBtn.disabled) return;\n  const result = computeResult();\n  renderResult(result);\n  document.getElementById(\"view-quiz\").classList.remove(\"active\");\n  document.getElementById(\"view-result\").classList.add(\"active\");\n  window.scrollTo({top:0, behavior:\"instant\"});\n});\n\n/* ============================================================\n   Score\n============================================================ */\nfunction computeResult(){\n  let R=0,Y=0,G=0;\n  QUESTIONS.forEach((q,i)=>{\n    if (answers[i] !== \"yes\") return;\n    if (q.tag===\"r\") R++;\n    else if (q.tag===\"y\") Y++;\n    else G++;\n  });\n  const P = 2*R + Y;\n  let verdict;\n  if (R >= 3 || P >= 6) verdict = \"r\";\n  else if (P <= 1 && G >= 3) verdict = \"g\";\n  else verdict = \"y\";\n  return {R,Y,G,P,verdict};\n}\n\n/* ============================================================\n   Result page\n============================================================ */\nfunction renderResult(res){\n  const v = res.verdict;\n  const c = RESULT_COPY[v];\n  const view = document.getElementById(\"view-result\");\n\n  const lightSvg = {\n    r: `<svg viewBox=\"0 0 64 88\" fill=\"none\" class=\"light-icon\"><rect x=\"14\" y=\"2\" width=\"36\" height=\"84\" rx=\"18\" fill=\"rgba(255,255,255,.18)\"/><circle cx=\"32\" cy=\"22\" r=\"11\" fill=\"#fff\"/><circle cx=\"32\" cy=\"48\" r=\"9\" fill=\"rgba(255,255,255,.22)\"/><circle cx=\"32\" cy=\"70\" r=\"9\" fill=\"rgba(255,255,255,.22)\"/><\u002Fsvg>`,\n    y: `<svg viewBox=\"0 0 64 88\" fill=\"none\" class=\"light-icon\"><rect x=\"14\" y=\"2\" width=\"36\" height=\"84\" rx=\"18\" fill=\"rgba(255,255,255,.18)\"/><circle cx=\"32\" cy=\"22\" r=\"9\" fill=\"rgba(255,255,255,.22)\"/><circle cx=\"32\" cy=\"48\" r=\"11\" fill=\"#fff\"/><circle cx=\"32\" cy=\"70\" r=\"9\" fill=\"rgba(255,255,255,.22)\"/><\u002Fsvg>`,\n    g: `<svg viewBox=\"0 0 64 88\" fill=\"none\" class=\"light-icon\"><rect x=\"14\" y=\"2\" width=\"36\" height=\"84\" rx=\"18\" fill=\"rgba(255,255,255,.18)\"/><circle cx=\"32\" cy=\"22\" r=\"9\" fill=\"rgba(255,255,255,.22)\"/><circle cx=\"32\" cy=\"48\" r=\"9\" fill=\"rgba(255,255,255,.22)\"/><circle cx=\"32\" cy=\"70\" r=\"11\" fill=\"#fff\"/><\u002Fsvg>`,\n  }[v];\n\n  const meterDots = Array.from({length:8}, (_,i)=>{\n    const threshold = v===\"g\" ? 2 : v===\"y\" ? 5 : 8;\n    return `<span class=\"${i<threshold?\"on\":\"\"}\"><\u002Fspan>`;\n  }).join(\"\");\n\n  view.innerHTML = `\n    <div class=\"result-hero ${v}\">\n      ${lightSvg}\n      <span class=\"verdict-eye\">你的结果<\u002Fspan>\n      <h2 class=\"verdict\">${c.title}<\u002Fh2>\n      <p class=\"verdict-sub\">${c.sub}<\u002Fp>\n      <div class=\"meter\">${meterDots}<\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"score-row\">\n      <div class=\"chip r\"><div class=\"num\" data-target=\"${res.R}\">0<\u002Fdiv><div class=\"lbl\">红灯 / 5<\u002Fdiv><\u002Fdiv>\n      <div class=\"chip y\"><div class=\"num\" data-target=\"${res.Y}\">0<\u002Fdiv><div class=\"lbl\">黄灯 / 5<\u002Fdiv><\u002Fdiv>\n      <div class=\"chip g\"><div class=\"num\" data-target=\"${res.G}\">0<\u002Fdiv><div class=\"lbl\">绿灯 / 5<\u002Fdiv><\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"panel\">\n      <h3 class=\"${v}\"><span class=\"pip\"><\u002Fspan>解读建议<\u002Fh3>\n      <p>${c.body}<\u002Fp>\n    <\u002Fdiv>\n\n    <div class=\"breakdown\">\n      <div class=\"br-title\">详细比例<\u002Fdiv>\n      <div class=\"br-row\">\n        <span class=\"br-label\">高风险习惯（红灯题）<\u002Fspan>\n        <div class=\"br-bar r\"><div class=\"f\" style=\"--w:${res.R/5*100}%\"><\u002Fdiv><\u002Fdiv>\n        <span class=\"br-val\">${res.R}/5<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"br-row\">\n        <span class=\"br-label\">需观察习惯（黄灯题）<\u002Fspan>\n        <div class=\"br-bar y\"><div class=\"f\" style=\"--w:${res.Y/5*100}%\"><\u002Fdiv><\u002Fdiv>\n        <span class=\"br-val\">${res.Y}/5<\u002Fspan>\n      <\u002Fdiv>\n      <div class=\"br-row\">\n        <span class=\"br-label\">健康保护习惯（绿灯题）<\u002Fspan>\n        <div class=\"br-bar g\"><div class=\"f\" style=\"--w:${res.G/5*100}%\"><\u002Fdiv><\u002Fdiv>\n        <span class=\"br-val\">${res.G}/5<\u002Fspan>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div class=\"cta-wrap\">\n      <button class=\"cta\" id=\"open-meal\">\n        领取一份《每日标准膳食清单》\n        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M7 17L17 7M9 7h8v8\"/><\u002Fsvg>\n      <\u002Fbutton>\n      <button class=\"restart\" id=\"restart\">← 重新填写<\u002Fbutton>\n    <\u002Fdiv>\n  `;\n\n  // animate count-up\n  view.querySelectorAll(\".chip .num\").forEach(el=>{\n    const target = +el.dataset.target;\n    const dur = 700;\n    const t0 = performance.now();\n    function step(t){\n      const k = Math.min(1,(t-t0)/dur);\n      const eased = 1 - Math.pow(1-k, 3);\n      el.textContent = Math.round(eased * target);\n      if (k<1) requestAnimationFrame(step);\n    }\n    requestAnimationFrame(step);\n  });\n  // animate breakdown bars\n  setTimeout(()=>{\n    view.querySelectorAll(\".br-bar .f\").forEach(f=>{\n      f.style.width = f.style.getPropertyValue(\"--w\");\n    });\n  }, 60);\n\n  document.getElementById(\"open-meal\").addEventListener(\"click\", openMeal);\n  document.getElementById(\"restart\").addEventListener(\"click\", restart);\n}\n\nfunction restart(){\n  for (let i=0;i<answers.length;i++) answers[i]=null;\n  qlist.querySelectorAll(\".qcard\").forEach(c=>{\n    c.classList.remove(\"answered\",\"matched\");\n    c.querySelectorAll(\".choice\").forEach(b=>b.classList.remove(\"selected\"));\n  });\n  updateProgress();\n  document.getElementById(\"view-result\").classList.remove(\"active\");\n  document.getElementById(\"view-quiz\").classList.add(\"active\");\n  window.scrollTo({top:0,behavior:\"instant\"});\n}\n\n/* ============================================================\n   Meal modal\n============================================================ */\nconst mealModal = document.getElementById(\"meal-modal\");\nconst mealBody = document.getElementById(\"meal-body\");\n\nfunction buildMeal(){\n  const d = MEAL_DATA;\n  mealBody.innerHTML = `\n    <div class=\"meal-hero\">\n      <p style=\"margin:0;color:var(--ink-2);font-size:13.5px;line-height:1.65\">${d.intro}<\u002Fp>\n      <div class=\"pillrow\">${d.pills.map(p=>`<span class=\"pill\">${p}<\u002Fspan>`).join(\"\")}<\u002Fdiv>\n    <\u002Fdiv>\n    ${d.groups.map(g=>`\n      <div class=\"meal-section\">\n        <div class=\"ms-head\">\n          <div class=\"ms-emoji ${g.key}\">${g.title.slice(0,1)}<\u002Fdiv>\n          <div class=\"titles\">\n            <h4>${g.title}<\u002Fh4>\n            <span>${g.sub}<\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"ms-body\">\n          ${g.items.map(it=>`\n            <div class=\"ms-row\">\n              <span class=\"item\">${it.item}<\u002Fspan>\n              <span class=\"qty\">${it.qty}<\u002Fspan>\n            <\u002Fdiv>`).join(\"\")}\n        <\u002Fdiv>\n      <\u002Fdiv>\n    `).join(\"\")}\n    <div class=\"meal-tip\">\n      <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#9c6a16\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex:0 0 auto;margin-top:1px\"><path d=\"M12 2v6M12 22v-2M4.93 4.93l4.24 4.24M14.83 14.83l4.24 4.24M2 12h6M16 12h6M4.93 19.07l4.24-4.24M14.83 9.17l4.24-4.24\"/><\u002Fsvg>\n      <div><strong>小习惯，更重要<\u002Fstrong><br>${d.tip.replace(\"小习惯，更重要：\",\"\")}<\u002Fdiv>\n    <\u002Fdiv>\n  `;\n}\nbuildMeal();\n\nfunction openMeal(){ mealModal.classList.add(\"open\"); document.body.style.overflow=\"hidden\"; }\nfunction closeMeal(){ mealModal.classList.remove(\"open\"); document.body.style.overflow=\"\"; }\nmealModal.addEventListener(\"click\", e=>{ if (e.target.dataset.close!==undefined) closeMeal(); });\ndocument.addEventListener(\"keydown\", e=>{ if (e.key===\"Escape\") closeMeal(); });\n\n/* init */\nupdateProgress();\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
